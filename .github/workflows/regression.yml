name: regression

# Regression suite for Issues #2, #3, #4, and #6. Runs the six
# self-contained test scripts in `tools/` on every push and pull request
# so we never accidentally break an already-closed-issue invariant
# without the CI bot catching it.
#
# These tests use only the Python 3 standard library, so no
# `pip install` step is needed. They each complete in well under a
# minute on a single CPU, so a 10-minute timeout is more than enough.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: regression-tests
    runs-on: ubuntu-latest
    # 20 minutes: the AC7 determinism check in
    # verify_issue2_routing_provenance.py spawns 6 full trace-subprocess
    # runs (each ~20s locally, ~60s on a slow GitHub-hosted runner),
    # plus 2 more for the captured-trace BUG-FIX test. Locally the
    # whole verifier completes in ~3.5 min; CI runners are ~3x slower.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test_no_duplicate_artifacts
        run: python tools/test_no_duplicate_artifacts.py

      - name: Run verify_issue2_routing_provenance
        run: python tools/verify_issue2_routing_provenance.py

      - name: Run verify_sm120_kernel_compat
        run: python tools/verify_sm120_kernel_compat.py

      # Issue #6 (Colibrì v1.6.2 loader hardening): typed error taxonomy,
      # cross-field architecture validator, and byte-range safetensors
      # validator. All three are pure-stdlib and run in milliseconds;
      # the architecture validator additionally exercises a real
      # Qwen3.8 config on disk. The malformed-checkpoint test crafts
      # synthetic safetensors shards with deliberately broken headers
      # and offsets to assert the *right* typed error fires.
      - name: Run test_loader_errors
        run: python tools/test_loader_errors.py

      - name: Run test_malformed_checkpoints
        run: python tools/test_malformed_checkpoints.py

      - name: Run validate_architecture against real Qwen3.8 config
        run: python tools/validate_architecture.py --config checkpoints/Qwen3.8-2.4T-A95B/config.json

      # Issue #6 follow-up: inventory_gguf.py was rewritten to fix three
      # structural bugs (hard-coded machine paths, undefined helper,
      # module-level code that ran before any def). This test guards
      # header parsing, tensor classification, shard discovery, and the
      # non-zero v2 memory-plan output. Requires the on-disk GGUF stub
      # shard under checkpoints/Qwen3.8-2.4T-A95B-GGUF-UD-Q1_0/.
      - name: Run test_inventory_gguf
        run: python tools/test_inventory_gguf.py
